[platformio]
default_envs = wireless_tracker

[env:wireless_tracker]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/inject_mesh_psk.py

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_qspi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_VERSION=\"1.0.4\"
    ; The uplink verifies the server certificate against the roots in src/certs.cpp. Uncomment only
    ; for servers whose CA is not in that bundle (the URL contains the API key).
    ; -DUPLINK_INSECURE_TLS
    ; OTA updates come from the latest release of this GitHub repository.
    ; -DOTA_REPO=\"owner/repo\"
    ; LoRa mesh: Meshtastic-compatible private channel. All trackers of one organisation need the same
    ; channel name and key. The key is set per device on the settings page and kept across updates.
    ; Optionally MESH_PSK_B64 (environment or gitignored .env) is built in as the key for devices that
    ; have none stored yet. Anything built in is readable from the binary, so never publish such builds.
    -DMESH_CHANNEL_NAME=\"UAV-BOS\"

lib_deps =
    jgromes/RadioLib@^7.1.2
    mikalhart/TinyGPSPlus@^1.1.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.9
