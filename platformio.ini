[platformio]
default_envs = wireless_tracker

[env:wireless_tracker]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/inject_mesh_psk.py

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_qspi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_VERSION=\"1.0.3\"
    ; Uncomment to verify the server certificate against the root CA in src/uplink.cpp
    ; -DUPLINK_VERIFY_TLS
    ; LoRa mesh: Meshtastic-compatible private channel. All trackers of one organisation need the same
    ; channel name and key. The key is not stored here. Local builds read MESH_PSK_B64 from the
    ; environment or from a gitignored .env file. Release builds use the GitHub Actions secret
    ; MESH_PSK_B64. Generate a key with: openssl rand -base64 32
    -DMESH_CHANNEL_NAME=\"UAV-BOS\"

lib_deps =
    jgromes/RadioLib@^7.1.2
    mikalhart/TinyGPSPlus@^1.1.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.9
